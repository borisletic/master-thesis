# Model matrix actually evaluated in the study.
#
# Two crossed dimensions:
#   - alignment (RQ2): from weakly-aligned (mistral) to safety-aggressive
#     (gemma2, llama3.1). No abliterated/uncensored models were used.
#   - quantization (RQ3): a Q8_0 -> Q4_K_M -> Q3_K_M -> Q2_K precision ladder on the
#     two instruct families (qwen2.5-7B, llama3.1-8B).
#
# `ollama_tag` is what `ollama pull` / the API expects. `approx_vram_gb` notes fit
# on the 8 GB RTX 4060; entries over ~8 GB offload partially to CPU (~3x slower).
#
# Note: this file documents the matrix; the pipeline takes model tags on the CLI
# (see scripts/run_sweep.sh, run_rq3.sh) rather than loading this YAML.

defaults:
  temperature: 0.0          # primary runs are greedy/deterministic
  num_predict: 512          # max new tokens
  seed: 42
  # RQ3 stochastic-robustness runs (reported as mean +/- std):
  repeat_temperatures: [0.0, 0.7, 1.0]
  repeats_per_temperature: [1, 3, 3]   # 1 at T=0 (deterministic), 3 each at 0.7/1.0

# ---- cross-model sweep (RQ1/RQ2/RQ4): six configurations, Q4_K_M unless noted ----
sweep:
  - family: mistral-7b
    alignment: weak
    ollama_tag: mistral:latest
    quant: q4_K_M
    approx_vram_gb: 4.4
  - family: phi3.5-mini
    alignment: instruct
    ollama_tag: phi3.5:3.8b-mini-instruct-q4_0
    quant: q4_0
    approx_vram_gb: 2.5
  - family: qwen2.5-7b
    alignment: instruct
    ollama_tag: qwen2.5:7b-instruct-q4_K_M
    quant: q4_K_M
    approx_vram_gb: 5.0
  - family: qwen2.5-7b
    alignment: instruct
    ollama_tag: qwen2.5:7b-instruct-q8_0
    quant: q8_0
    approx_vram_gb: 8.1        # borderline; partial CPU offload
  - family: llama3.1-8b
    alignment: instruct
    ollama_tag: llama3.1:8b-instruct-q4_K_M
    quant: q4_K_M
    approx_vram_gb: 5.5
  - family: gemma2-9b
    alignment: instruct
    ollama_tag: gemma2:9b-instruct-q4_K_M
    quant: q4_K_M
    approx_vram_gb: 6.5

# ---- RQ3 precision ladder: Q8 -> Q4 -> Q3 -> Q2 on two families ----
rq3_ladder:
  qwen2.5-7b:
    - {quant: q8_0,   ollama_tag: qwen2.5:7b-instruct-q8_0,   approx_vram_gb: 8.1}
    - {quant: q4_K_M, ollama_tag: qwen2.5:7b-instruct-q4_K_M, approx_vram_gb: 5.0}
    - {quant: q3_K_M, ollama_tag: qwen2.5:7b-instruct-q3_K_M, approx_vram_gb: 4.0}
    - {quant: q2_K,   ollama_tag: qwen2.5:7b-instruct-q2_K,   approx_vram_gb: 3.2}
  llama3.1-8b:
    - {quant: q8_0,   ollama_tag: llama3.1:8b-instruct-q8_0,   approx_vram_gb: 8.5}
    - {quant: q4_K_M, ollama_tag: llama3.1:8b-instruct-q4_K_M, approx_vram_gb: 5.5}
    - {quant: q3_K_M, ollama_tag: llama3.1:8b-instruct-q3_K_M, approx_vram_gb: 4.7}
    - {quant: q2_K,   ollama_tag: llama3.1:8b-instruct-q2_K,   approx_vram_gb: 3.6}

# ---- classifier judge and utility grader ----
judge:
  refusal_judge: qwen2.5:7b-instruct-q4_K_M    # validated vs humans, kappa = 0.72
  utility_grader: qwen2.5:7b-instruct-q4_K_M    # primary
  utility_grader_independent: gemma2:9b-instruct-q4_K_M  # cross-check, r = 0.85

# ---- system-prompt mitigation (intervention) ----
mitigation:
  models: [gemma2:9b-instruct-q4_K_M, llama3.1:8b-instruct-q4_K_M]
  # defensive-role system prompt; see scripts/run_mitigation.py
